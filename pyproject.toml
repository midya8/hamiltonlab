[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "hamiltonlab"
version = "0.1.0"
description = "Auditable fixed-setting Hamiltonian Monte Carlo"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
hamiltonlab = "hamiltonlab.cli:main"
[tool.setuptools.packages.find]
include = ["hamiltonlab*"]
